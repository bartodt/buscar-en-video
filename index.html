<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador en videos de YouTube</title>
<style>
  :root {
    color-scheme: light dark;
    --fondo: #f6f6f7;
    --tarjeta: #ffffff;
    --texto: #1a1a1c;
    --tenue: #6b6b73;
    --borde: #dededf;
    --acento: #c8102e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #17171a;
      --tarjeta: #1f1f23;
      --texto: #ececee;
      --tenue: #9a9aa3;
      --borde: #34343a;
      --acento: #ff5a72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 44rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: var(--tenue); margin: 0 0 2rem; font-size: .95rem; }
  form { display: grid; gap: .75rem; }
  .fila { display: flex; gap: .75rem; }
  .fila input { flex: 1; }
  input {
    width: 100%;
    padding: .7rem .85rem;
    font-size: 1rem;
    color: var(--texto);
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: .5rem;
  }
  input:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
  button {
    padding: .7rem 1.4rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--acento);
    border: 0;
    border-radius: .5rem;
    cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  /* Secundario: no compite con Buscar, que es la acción principal. */
  button.secundario {
    justify-self: start;
    padding: .3rem 0;
    font-size: .9rem;
    font-weight: 500;
    color: var(--acento);
    background: none;
    text-decoration: underline;
  }
  #estado { margin: 1.5rem 0 0; color: var(--tenue); }
  #estado.error { color: var(--acento); }
  #titulo { margin: 1.75rem 0 .75rem; font-size: .9rem; color: var(--tenue); }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
  a.resultado {
    display: grid;
    grid-template-columns: 5rem 1fr;
    gap: .75rem;
    align-items: baseline;
    padding: .85rem 1rem;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: .5rem;
    text-decoration: none;
    color: inherit;
  }
  a.resultado:hover { border-color: var(--acento); }
  .marca {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--acento);
  }
  .cita { color: var(--texto); }
  label.opcion {
    display: flex;
    align-items: center;
    gap: .5rem;
    color: var(--tenue);
    font-size: .9rem;
  }
  label.opcion input { width: auto; padding: 0; }
  /* Le da nombre accesible a los campos sin agregar texto visible: el placeholder
     desaparece al tipear y un lector de pantalla se queda sin saber qué es cada uno. */
  .oculto {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  @media (max-width: 30rem) {
    a.resultado { grid-template-columns: 1fr; gap: .3rem; }
  }
</style>
</head>
<body>
<main>
  <h1>¿En qué minuto lo dijeron?</h1>
  <p class="sub">Pegá el link de un video de YouTube y buscá una palabra o una frase.</p>

  <form id="form">
    <label class="oculto" for="url">Link del video de YouTube</label>
    <!-- type="text" y no "url": el servidor también acepta el id pelado de 11
         caracteres, y con type="url" el navegador lo rechazaba antes de mandarlo. -->
    <input id="url" type="text" inputmode="url" required
           placeholder="https://www.youtube.com/watch?v=..."
           autocomplete="off" spellcheck="false">
    <div class="fila">
      <label class="oculto" for="consulta">Palabra o frase a buscar</label>
      <input id="consulta" type="text" required placeholder="palabra o frase a buscar"
             autocomplete="off">
      <button id="boton" type="submit">Buscar</button>
    </div>
    <label class="opcion">
      <input id="forzar_whisper" type="checkbox">
      Transcribir el audio con IA (WhisperX) — más lento, pero encuentra nombres propios
      que YouTube escribió mal
    </label>
    <!-- type="button": no dispara la validación del campo de búsqueda, que para ver
         la transcripción no hace falta llenar. -->
    <button id="ver_todo" type="button" class="secundario">Ver toda la transcripción</button>
  </form>

  <p id="estado" aria-live="polite"></p>
  <p id="titulo" hidden></p>
  <ol id="resultados"></ol>
</main>

<script>
  const form = document.getElementById("form");
  const boton = document.getElementById("boton");
  const estado = document.getElementById("estado");
  const titulo = document.getElementById("titulo");
  const lista = document.getElementById("resultados");
  const forzar = document.getElementById("forzar_whisper");
  const botonTodo = document.getElementById("ver_todo");
  const campoUrl = document.getElementById("url");
  const campoConsulta = document.getElementById("consulta");

  // La primera busqueda de un video baja el texto; las siguientes salen del cache.
  // Se indexa por el video_id que devuelve el servidor y no por la URL tipeada: asi
  // pegar youtu.be/X despues de youtube.com/watch?v=X no vuelve a mostrar la espera.
  const vistos = new Set();
  const idsPorUrl = new Map();

  function cronometro(mensaje) {
    const arranque = Date.now();
    const pintar = () => {
      const seg = Math.floor((Date.now() - arranque) / 1000);
      const mm = Math.floor(seg / 60);
      const ss = String(seg % 60).padStart(2, "0");
      estado.textContent = `${mensaje} (${mm}:${ss})`;
    };
    pintar();
    return setInterval(pintar, 1000);
  }

  function pintar(items) {
    const trozo = document.createDocumentFragment();
    for (const item of items) {
      const enlace = document.createElement("a");
      enlace.className = "resultado";
      enlace.href = item.link;
      enlace.target = "_blank";
      enlace.rel = "noopener";

      const marca = document.createElement("span");
      marca.className = "marca";
      marca.textContent = item.timestamp;

      const cita = document.createElement("span");
      cita.className = "cita";
      cita.textContent = item.texto;

      enlace.append(marca, cita);
      const fila = document.createElement("li");
      fila.append(enlace);
      trozo.append(fila);
    }
    lista.append(trozo);
  }

  // Las dos rutas devuelven `resultados` con la misma forma, así que se pintan igual.
  // consulta === null significa "mostrame la transcripción entera".
  async function ejecutar(ruta, consulta) {
    const url = campoUrl.value.trim();
    if (!url) {
      estado.className = "error";
      estado.textContent = "Pegá primero el link de un video de YouTube.";
      campoUrl.focus();
      return;
    }
    const forzarWhisper = forzar.checked;
    const modo = forzarWhisper ? "ia" : "subs";
    const yaBajado = idsPorUrl.has(url) && vistos.has(idsPorUrl.get(url) + "|" + modo);

    lista.replaceChildren();
    titulo.hidden = true;
    estado.className = "";
    boton.disabled = true;
    botonTodo.disabled = true;

    // Transcribir baja el audio entero y lo pasa por el modelo: son minutos, no segundos.
    let tic = null;
    if (yaBajado) {
      estado.textContent = consulta === null ? "Armando la transcripción…" : "Buscando…";
    } else if (forzarWhisper) {
      tic = cronometro("Transcribiendo el audio con IA, esto tarda varios minutos…");
    } else {
      estado.textContent = "Bajando los subtítulos, puede tardar unos segundos…";
    }

    try {
      const respuesta = await fetch(ruta, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, consulta, forzar_whisper: forzarWhisper }),
      });
      let datos;
      try {
        datos = await respuesta.json();
      } catch {
        // Un 500 con traceback, o el servidor caido a mitad: sin esto el usuario
        // veia "Unexpected token '<' in JSON at position 0".
        throw new Error(
          "El servidor respondió algo que no entiendo. " +
          "Fijate si hay un error en la ventana de Terminal."
        );
      }
      if (!respuesta.ok) throw new Error(datos.error || "Algo falló.");

      clearInterval(tic);
      tic = null;
      idsPorUrl.set(url, datos.video_id);
      vistos.add(datos.video_id + "|" + modo);
      // El aviso es lo que el servidor no puede decir con los resultados: que los
      // subtítulos salieron del caché viejo, o que son una traducción automática y
      // las palabras pueden no ser las que se dijeron.
      const notas = [];
      if (datos.fuente === "whisperx") notas.push("transcripción con IA");
      if (datos.aviso) notas.push(datos.aviso);
      titulo.textContent = [datos.titulo, ...notas].join(" — ");
      titulo.hidden = false;

      if (!datos.resultados.length) {
        estado.textContent = consulta === null
          ? "Este video no tiene texto para mostrar."
          : `No aparece “${consulta}” en este video.`;
        return;
      }

      const cantidad = datos.resultados.length;
      const total = datos.total || cantidad;
      if (consulta === null) {
        estado.textContent =
          `Transcripción completa, ${cantidad} ${cantidad === 1 ? "bloque" : "bloques"}. ` +
          `Tocá cualquiera para abrir el video en ese momento:`;
      } else {
        const aproximado = datos.resultados.some((item) => item.aproximado);
        // El servidor corta la lista para no colgar al navegador, pero cuenta todas:
        // decir cuántas hay evita que parezca que aparece 200 veces justas.
        const cuenta = total > cantidad
          ? `${total} resultados, muestro los primeros ${cantidad}`
          : `${cantidad} ${cantidad === 1 ? "resultado" : "resultados"}`;
        estado.textContent = aproximado
          ? `No aparece “${consulta}” tal cual, pero sí algo muy parecido (${cuenta}):`
          : `${cuenta}:`;
      }

      pintar(datos.resultados);
    } catch (error) {
      estado.className = "error";
      // Un TypeError acá es siempre el fetch que no llegó a ningún lado.
      estado.textContent = error instanceof TypeError
        ? "Se cortó la conexión con el buscador. ¿Seguís teniendo abierta la ventana de Terminal?"
        : error.message;
    } finally {
      clearInterval(tic);
      boton.disabled = false;
      botonTodo.disabled = false;
    }
  }

  form.addEventListener("submit", (evento) => {
    evento.preventDefault();
    ejecutar("/api/buscar", campoConsulta.value.trim());
  });

  botonTodo.addEventListener("click", () => ejecutar("/api/transcripcion", null));
</script>
</body>
</html>
