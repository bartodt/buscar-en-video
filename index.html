<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador en videos de YouTube</title>
<style>
  :root {
    color-scheme: light dark;
    --fondo: #f6f6f7;
    --tarjeta: #ffffff;
    --texto: #1a1a1c;
    --tenue: #6b6b73;
    --borde: #dededf;
    --acento: #c8102e;
    --marca: #ffd9df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #17171a;
      --tarjeta: #1f1f23;
      --texto: #ececee;
      --tenue: #9a9aa3;
      --borde: #34343a;
      --acento: #ff5a72;
      --marca: #5a2430;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 44rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: var(--tenue); margin: 0 0 2rem; font-size: .95rem; }
  .pie { margin-top: 3rem; }
  form { display: grid; gap: .75rem; }
  .fila { display: flex; gap: .75rem; }
  .fila input { flex: 1; }
  input {
    width: 100%;
    padding: .7rem .85rem;
    font-size: 1rem;
    color: var(--texto);
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: .5rem;
  }
  input:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
  button {
    padding: .7rem 1.4rem;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--acento);
    border: 0;
    border-radius: .5rem;
    cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  /* Secundario: no compite con Buscar, que es la acción principal. */
  button.secundario {
    justify-self: start;
    padding: .3rem 0;
    font-size: .9rem;
    font-weight: 500;
    color: var(--acento);
    background: none;
    text-decoration: underline;
  }
  #estado { margin: 1.5rem 0 0; color: var(--tenue); }
  #estado.error { color: var(--acento); }
  /* La respuesta que se vino a buscar es el número, no la lista: va primero y grande.
     Antes vivía dentro de la misma frase gris que los mensajes de progreso. */
  #resumen { margin: 2rem 0 1rem; }
  .cuenta {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: .5rem;
    margin: 0;
  }
  .cuenta b {
    font-size: 3rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--acento);
  }
  .cuenta span { font-size: 1.1rem; }
  #titulo, #detalle { margin: .5rem 0 0; font-size: .9rem; color: var(--tenue); }
  #copiar { margin-top: .75rem; }
  #copiar.listo { color: var(--tenue); text-decoration: none; }
  mark {
    background: var(--marca);
    color: inherit;
    font-weight: 600;
    border-radius: .2rem;
    padding: 0 .1em;
  }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
  a.resultado {
    display: grid;
    grid-template-columns: 5rem 1fr;
    gap: .75rem;
    align-items: baseline;
    padding: .85rem 1rem;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: .5rem;
    text-decoration: none;
    color: inherit;
  }
  a.resultado:hover { border-color: var(--acento); }
  .marca {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--acento);
  }
  .cita { color: var(--texto); }
  .menciones {
    display: block;
    margin-top: .15rem;
    font-size: .75rem;
    font-weight: 500;
    color: var(--tenue);
  }
  label.opcion {
    display: flex;
    align-items: center;
    gap: .5rem;
    color: var(--tenue);
    font-size: .9rem;
  }
  label.opcion input { width: auto; padding: 0; }
  /* Le da nombre accesible a los campos sin agregar texto visible: el placeholder
     desaparece al tipear y un lector de pantalla se queda sin saber qué es cada uno. */
  .oculto {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  @media (max-width: 30rem) {
    a.resultado { grid-template-columns: 1fr; gap: .3rem; }
  }
</style>
</head>
<body>
<main>
  <h1>¿En qué minuto lo dijeron?</h1>
  <p class="sub">Pegá el link de un video de YouTube y buscá una palabra o una frase.</p>

  <form id="form">
    <label class="oculto" for="url">Link del video de YouTube</label>
    <!-- type="text" y no "url": el servidor también acepta el id pelado de 11
         caracteres, y con type="url" el navegador lo rechazaba antes de mandarlo. -->
    <input id="url" type="text" inputmode="url" required
           placeholder="https://www.youtube.com/watch?v=..."
           autocomplete="off" spellcheck="false">
    <div class="fila">
      <label class="oculto" for="consulta">Palabra o frase a buscar</label>
      <input id="consulta" type="text" required placeholder="palabra o frase a buscar"
             autocomplete="off">
      <button id="boton" type="submit">Buscar</button>
    </div>
    <label class="opcion">
      <input id="forzar_whisper" type="checkbox">
      Transcribir el audio con IA (WhisperX) — más lento, pero encuentra nombres propios
      que YouTube escribió mal
    </label>
    <!-- type="button": no dispara la validación del campo de búsqueda, que para ver
         la transcripción no hace falta llenar. -->
    <button id="ver_todo" type="button" class="secundario">Ver toda la transcripción</button>
  </form>

  <p id="estado" aria-live="polite"></p>

  <section id="resumen" aria-live="polite" hidden>
    <p class="cuenta"><b id="numero"></b> <span id="leyenda"></span></p>
    <p id="detalle" hidden></p>
    <p id="titulo"></p>
    <button id="copiar" type="button" class="secundario">Copiar resultados</button>
  </section>

  <ol id="resultados"></ol>

  <!-- La app no tiene ventana propia ni icono en el Dock: este botón es la única
       forma visible de apagar el motor cuando se termina de usar. -->
  <p class="pie">
    <button id="apagar" type="button" class="secundario">Cerrar el buscador</button>
  </p>
</main>

<script>
  const form = document.getElementById("form");
  const boton = document.getElementById("boton");
  const estado = document.getElementById("estado");
  const titulo = document.getElementById("titulo");
  const lista = document.getElementById("resultados");
  const forzar = document.getElementById("forzar_whisper");
  const botonTodo = document.getElementById("ver_todo");
  const campoUrl = document.getElementById("url");
  const campoConsulta = document.getElementById("consulta");
  const resumen = document.getElementById("resumen");
  const numero = document.getElementById("numero");
  const leyenda = document.getElementById("leyenda");
  const detalle = document.getElementById("detalle");
  const botonCopiar = document.getElementById("copiar");

  // Lo último que se mostró, tal cual se pintó: es lo que copia el botón.
  let ultimo = null;

  // La primera busqueda de un video baja el texto; las siguientes salen del cache.
  // Se indexa por el video_id que devuelve el servidor y no por la URL tipeada: asi
  // pegar youtu.be/X despues de youtube.com/watch?v=X no vuelve a mostrar la espera.
  const vistos = new Set();
  const idsPorUrl = new Map();

  // Mientras la IA trabaja, el servidor publica en /api/progreso en qué anda y en qué
  // porcentaje, y acá se lo pregunta una vez por segundo. Sin esto la única señal de
  // avance era el "Progress: 12%" de whisperx en la ventana negra de Terminal, que
  // empaquetado como app no existe: la espera de 40 minutos quedaba completamente ciega.
  function cronometro(mensaje) {
    const arranque = Date.now();
    let progreso = null;
    const pintar = () => {
      const seg = Math.floor((Date.now() - arranque) / 1000);
      const mm = Math.floor(seg / 60);
      const ss = String(seg % 60).padStart(2, "0");
      let que = mensaje;
      if (progreso && progreso.etapa) {
        que = progreso.etapa.charAt(0).toUpperCase() + progreso.etapa.slice(1);
        que += progreso.pct == null ? "…" : ` ${Math.round(progreso.pct)}%`;
      }
      estado.textContent = `${que} (${mm}:${ss})`;
    };
    const consultar = async () => {
      try {
        const respuesta = await fetch("/api/progreso");
        progreso = respuesta.ok ? await respuesta.json() : null;
      } catch {
        // Si el buscador se cayó lo reporta el fetch grande, con su mensaje. Acá se
        // ignora a propósito: un cronómetro no tiene que pisar el error de verdad.
      }
      pintar();
    };
    pintar();
    return setInterval(consultar, 1000);
  }

  // El servidor manda en `marcas` dónde cae cada mención dentro del fragmento, en
  // orden y sin pisarse. Se arma con nodos de texto y no con innerHTML: el texto
  // viene de la transcripción de un video cualquiera y meterlo como HTML sería
  // confiar en que nadie diga "<script>".
  function cita(texto, marcas) {
    const trozo = document.createDocumentFragment();
    let cursor = 0;
    for (const marca of Array.isArray(marcas) ? marcas : []) {
      const [inicio, fin] = Array.isArray(marca) ? marca : [];
      // Índices que no cierran, o que se van para atrás: se sigue de largo y esa
      // mención queda sin resaltar. Un resaltado corrido es peor que ninguno.
      if (!(Number.isInteger(inicio) && Number.isInteger(fin)
            && inicio >= cursor && inicio < fin && fin <= texto.length)) continue;
      const resaltado = document.createElement("mark");
      resaltado.textContent = texto.slice(inicio, fin);
      trozo.append(texto.slice(cursor, inicio), resaltado);
      cursor = fin;
    }
    trozo.append(texto.slice(cursor));
    return trozo;
  }

  function pintar(items) {
    const trozo = document.createDocumentFragment();
    for (const item of items) {
      const enlace = document.createElement("a");
      enlace.className = "resultado";
      enlace.href = item.link;
      enlace.target = "_blank";
      enlace.rel = "noopener";

      const marca = document.createElement("span");
      marca.className = "marca";
      marca.textContent = item.timestamp;
      // Una tarjeta puede juntar varias menciones seguidas. Sin este número, dos
      // tarjetas con distinta cantidad de resaltados se ven igual de lejos y no
      // cierran contra el total de arriba.
      if (item.menciones > 1) {
        const cuantas = document.createElement("small");
        cuantas.className = "menciones";
        cuantas.textContent = `${item.menciones} menciones`;
        marca.append(cuantas);
      }

      const texto = document.createElement("span");
      texto.className = "cita";
      texto.append(cita(item.texto, item.marcas));

      enlace.append(marca, texto);
      const fila = document.createElement("li");
      fila.append(enlace);
      trozo.append(fila);
    }
    lista.append(trozo);
  }

  // La respuesta que el cliente vino a buscar es "cuántas veces", no la lista: va
  // arriba y en grande, incluso cuando la respuesta es cero. Cero también es un dato
  // que se reporta, así que se muestra igual que cualquier otro y no como un error.
  function mostrar(cuenta, texto, aviso, datos, notas) {
    numero.textContent = cuenta;
    leyenda.textContent = texto;
    detalle.textContent = aviso;
    detalle.hidden = !aviso;
    titulo.textContent = [datos.titulo, ...notas].join(" — ");
    botonCopiar.textContent = "Copiar resultados";
    botonCopiar.className = "secundario";
    resumen.hidden = false;
    ultimo = {
      encabezado: `${cuenta} ${texto}`,
      aviso,
      titulo: titulo.textContent,
      filas: datos.resultados,
    };
  }

  // Esto no se mira y se olvida: se pega en un mail o en una planilla. Las filas van
  // separadas por tabuladores para que caigan en columnas al pegarlas en Excel y
  // sigan leyéndose como texto corrido en cualquier otro lado. La columna de
  // menciones no es decorativa: una fila puede valer por tres, y sin ella sumar los
  // renglones en la planilla daría menos que el total del encabezado.
  function paraCopiar() {
    const lineas = [ultimo.encabezado];
    if (ultimo.aviso) lineas.push(ultimo.aviso);
    if (ultimo.titulo) lineas.push(ultimo.titulo);
    lineas.push("");
    lineas.push(["Momento", "Menciones", "Lo que se dijo", "Link"].join("\t"));
    for (const item of ultimo.filas) {
      lineas.push([item.timestamp, item.menciones || 1, item.texto, item.link].join("\t"));
    }
    return lineas.join("\n");
  }

  botonCopiar.addEventListener("click", async () => {
    if (!ultimo) return;
    try {
      await navigator.clipboard.writeText(paraCopiar());
      botonCopiar.textContent = "¡Copiado!";
    } catch {
      // El navegador puede negar el portapapeles. Antes que quedarse mudo, se
      // selecciona el resumen entero para que se pueda copiar con Cmd+C a mano.
      const rango = document.createRange();
      rango.selectNodeContents(document.querySelector("main"));
      const seleccion = getSelection();
      seleccion.removeAllRanges();
      seleccion.addRange(rango);
      botonCopiar.textContent = "No me dejaron copiar — quedó seleccionado, hacé Cmd+C";
    }
    botonCopiar.className = "secundario listo";
  });

  // Las dos rutas devuelven `resultados` con la misma forma, así que se pintan igual.
  // consulta === null significa "mostrame la transcripción entera".
  async function ejecutar(ruta, consulta) {
    const url = campoUrl.value.trim();
    if (!url) {
      estado.className = "error";
      estado.textContent = "Pegá primero el link de un video de YouTube.";
      campoUrl.focus();
      return;
    }
    const forzarWhisper = forzar.checked;
    const modo = forzarWhisper ? "ia" : "subs";
    const yaBajado = idsPorUrl.has(url) && vistos.has(idsPorUrl.get(url) + "|" + modo);

    lista.replaceChildren();
    resumen.hidden = true;
    ultimo = null;
    estado.className = "";
    boton.disabled = true;
    botonTodo.disabled = true;

    // Transcribir baja el audio entero y lo pasa por el modelo: son minutos, no segundos.
    let tic = null;
    if (yaBajado) {
      estado.textContent = consulta === null ? "Armando la transcripción…" : "Buscando…";
    } else if (forzarWhisper) {
      tic = cronometro("Transcribiendo el audio con IA, esto tarda varios minutos…");
    } else {
      estado.textContent = "Bajando los subtítulos, puede tardar unos segundos…";
    }

    try {
      const respuesta = await fetch(ruta, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, consulta, forzar_whisper: forzarWhisper }),
      });
      let datos;
      try {
        datos = await respuesta.json();
      } catch {
        // Un 500 con traceback, o el servidor caido a mitad: sin esto el usuario
        // veia "Unexpected token '<' in JSON at position 0".
        throw new Error(
          "El buscador respondió algo que no entiendo. " +
          "Cerralo y volvé a abrirlo."
        );
      }
      if (!respuesta.ok) throw new Error(datos.error || "Algo falló.");

      clearInterval(tic);
      tic = null;
      idsPorUrl.set(url, datos.video_id);
      vistos.add(datos.video_id + "|" + modo);
      // El aviso es lo que el servidor no puede decir con los resultados: que los
      // subtítulos salieron del caché viejo, o que son una traducción automática y
      // las palabras pueden no ser las que se dijeron.
      const notas = [];
      if (datos.fuente === "whisperx") notas.push("transcripción con IA");
      if (datos.aviso) notas.push(datos.aviso);
      // El progreso ya no tiene nada que decir: la respuesta está en el resumen.
      estado.textContent = "";

      const cantidad = datos.resultados.length;
      const total = datos.total || cantidad;
      if (consulta === null) {
        mostrar(cantidad, cantidad === 1 ? "bloque de transcripción" : "bloques de transcripción",
                cantidad
                  ? "Tocá cualquiera para abrir el video en ese momento."
                  : "Este video no tiene texto para mostrar.",
                datos, notas);
      } else {
        const avisos = [];
        if (datos.resultados.some((item) => item.aproximado)) {
          avisos.push(`No aparece “${consulta}” tal cual, pero sí algo muy parecido.`);
        }
        // El servidor corta la lista para no colgar al navegador, pero cuenta todas:
        // el número grande es el total, y acá se aclara que la lista quedó cortada.
        // `cantidad` son tarjetas y `mostradas` son menciones: con el agrupado no
        // son lo mismo, y lo que hay que decir acá es cuántas menciones se ven.
        const mostradas = datos.resultados.reduce((suma, item) => suma + (item.menciones || 1), 0);
        if (total > mostradas) avisos.push(`Abajo muestro las primeras ${mostradas}.`);
        mostrar(total, `${total === 1 ? "vez" : "veces"} se dijo “${consulta}”`,
                avisos.join(" "), datos, notas);
      }

      pintar(datos.resultados);
    } catch (error) {
      estado.className = "error";
      // Un TypeError acá es siempre el fetch que no llegó a ningún lado.
      estado.textContent = error instanceof TypeError
        ? "Se cortó la conexión con el buscador. ¿Se cerró? Abrilo de nuevo y probá otra vez."
        : error.message;
    } finally {
      clearInterval(tic);
      boton.disabled = false;
      botonTodo.disabled = false;
    }
  }

  document.getElementById("apagar").addEventListener("click", async () => {
    estado.className = "";
    estado.textContent = "Cerrando…";
    try {
      await fetch("/api/apagar", { method: "POST" });
    } catch {
      // Se murió antes de contestar, que es exactamente lo que le pedimos.
    }
    document.querySelector("main").replaceChildren(
      Object.assign(document.createElement("h1"), { textContent: "Listo, ya está cerrado." }),
      Object.assign(document.createElement("p"), {
        className: "sub",
        textContent: "Podés cerrar esta pestaña. Para volver a usarlo, doble clic en el ícono de siempre.",
      }),
    );
  });

  form.addEventListener("submit", (evento) => {
    evento.preventDefault();
    ejecutar("/api/buscar", campoConsulta.value.trim());
  });

  botonTodo.addEventListener("click", () => ejecutar("/api/transcripcion", null));
</script>
</body>
</html>
